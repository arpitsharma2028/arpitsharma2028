name: Update profile art

# Refreshes the contribution graph SVG from real data.
# Pushes to the dedicated 'output' branch so it NEVER creates fake commits on master
# or counts as artificial contributions on your GitHub profile.

on:
  schedule:
    - cron: "0 0 * * *"   # Daily refresh at midnight UTC
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile-art.yml'

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data
        run: |
          mkdir -p dist data
          python scripts/fetch_contributions.py

      - name: Render animated contribution graph SVG
        run: |
          python scripts/generate_streak_svg.py arpitsharma2028 dist/contrib-heatmap.svg
          cp data/contributions.json dist/contributions.json 2>/dev/null || true

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
